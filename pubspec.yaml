name: von
description: Local-first AI sandboxes for Android.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # FFI bridge to the Rust core. Pinned to match the `flutter_rust_bridge`
  # version in rust/Cargo.toml — a mismatch produces generated code that fails
  # to compile, so bump both together.
  flutter_rust_bridge: 2.7.1

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Apple-style continuous corners (Design.md §4). Flutter's own
  # BorderRadius.circular draws a circular arc, which reads wrong at the radii
  # this design uses.
  smooth_corner: ^1.1.0

  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0

  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  google_fonts: ^6.2.1

  path_provider: ^2.1.3
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true

  assets:
    # Generated from the source logo by tool/gen_icons.py, alongside the
    # launcher icons, so the two never drift apart.
    - assets/von_logo.png
