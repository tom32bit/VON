[package]
name = "von"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "VON core: sandboxing, agent loop, local + cloud inference, resource governor"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["ffi", "local-llm", "wasm-exec", "python-exec"]
# The Dart bridge. Requires `frb_generated.rs`, so it is off for plain
# `cargo test` runs that have not run codegen. See src/lib.rs.
ffi = []
# Local GGUF inference through llama.cpp. Requires the NDK when cross-compiling.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs"]
# Wasmtime-backed execution of agent-authored .wasm modules.
wasm-exec = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Embedded RustPython interpreter for agent-authored Python.
python-exec = ["dep:rustpython-vm", "dep:rustpython-stdlib", "dep:rustpython-pylib"]

[dependencies]
flutter_rust_bridge = "=2.7.1"

anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tiny_http = "0.12"
sysinfo = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }
zip = { version = "0.6", default-features = false, features = ["deflate", "time"] }
walkdir = "2.5"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mime_guess = "2.0"
percent-encoding = "2.3"

llama-cpp-2 = { version = "0.1.152", optional = true }
# Streaming UTF-8 decode for token pieces; `token_to_piece` takes the
# decoder directly, which is how llama-cpp-rs's own example does it.
encoding_rs = { version = "0.8", optional = true }
wasmtime = { version = "20.0", default-features = false, optional = true, features = [
    "cranelift",
    "runtime",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "20.0", optional = true }
# 0.4 rather than 0.3 for one specific reason: rustpython-stdlib 0.3 pins
# `libsqlite3-sys ^0.25` while rusqlite 0.31 wants `^0.28`. Both declare
# `links = "sqlite3"`, and Cargo allows only one package per `links` value, so
# the two cannot coexist — an unresolvable conflict, not a feature-flag issue.
# 0.4 moved to `^0.28` and agrees with rusqlite.
#
# (On Android the point is moot: stdlib gates that dependency behind
# `cfg(not(target_os = "android"))`. Only host-side `cargo test` ever hit it.)
rustpython-vm = { version = "0.4", optional = true, default-features = false, features = [
    "compiler",
    "freeze-stdlib",
] }
rustpython-stdlib = { version = "0.4", optional = true, default-features = false }
# Supplies the *pure-Python* half of the standard library as frozen modules.
# rustpython-stdlib only registers the native ones, so without this `import io`
# fails and the VM prints "encodings initialization failed" on startup.
rustpython-pylib = { version = "0.4", optional = true, default-features = false, features = [
    "freeze-stdlib",
] }

[target.'cfg(target_os = "android")'.dependencies]
# The thermal API is resolved with dlsym at runtime (see governor.rs), so
# ndk-sys is only here for the type/constant definitions.
ndk-sys = "0.6"
android_logger = "0.14"
log = "0.4"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.1"

# Release builds ship inside an APK: prioritise size, keep unwinding for
# tool-call errors that must be reported back to the agent rather than abort.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
