[package]
name = "von"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "VON core: sandboxing, agent loop, local + cloud inference, resource governor"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[features]
default = ["local-llm", "wasm-exec", "python-exec"]
# Local GGUF inference through llama.cpp. Requires the NDK when cross-compiling.
local-llm = ["dep:llama-cpp-2"]
# Wasmtime-backed execution of agent-authored .wasm modules.
wasm-exec = ["dep:wasmtime", "dep:wasmtime-wasi"]
# Embedded RustPython interpreter for agent-authored Python.
python-exec = ["dep:rustpython-vm", "dep:rustpython-stdlib"]

[dependencies]
flutter_rust_bridge = "=2.7.1"

anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
futures = "0.3"
parking_lot = "0.12"
once_cell = "1.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tiny_http = "0.12"
sysinfo = "0.30"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls-webpki-roots",
] }
zip = { version = "0.6", default-features = false, features = ["deflate", "time"] }
walkdir = "2.5"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mime_guess = "2.0"
percent-encoding = "2.3"

llama-cpp-2 = { version = "0.1.54", optional = true }
wasmtime = { version = "20.0", default-features = false, optional = true, features = [
    "cranelift",
    "runtime",
    "parallel-compilation",
] }
wasmtime-wasi = { version = "20.0", optional = true }
rustpython-vm = { version = "0.3", optional = true, default-features = false, features = [
    "compiler",
    "freeze-stdlib",
] }
rustpython-stdlib = { version = "0.3", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
# The thermal API is resolved with dlsym at runtime (see governor.rs), so
# ndk-sys is only here for the type/constant definitions.
ndk-sys = "0.6"
android_logger = "0.14"
log = "0.4"

[dev-dependencies]
tempfile = "3.10"
serial_test = "3.1"

# Release builds ship inside an APK: prioritise size, keep unwinding for
# tool-call errors that must be reported back to the agent rather than abort.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
